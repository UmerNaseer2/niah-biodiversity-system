# Copy this to secrets.toml, which git ignores, and fill it in. Never commit secrets.toml.
# install-edge.sh does that the first time, with new MQTT passwords filled in:
# /opt/iot-edge/secrets.toml, next to config.toml, readable only by root and iotedge.
# After editing:  iot-edge restart

# The project's edge-com address and its anon (publishable) key. The anon key is not secret on its
# own: it only lets this edge ask, and the token is what edge-com checks. Leave the anon key
# empty while JWT verification is OFF for edge-com.
supabase_function_url = "https://YOUR_PROJECT_REF.supabase.co/functions/v1/edge-com"
supabase_anon_key = ""

# This device's ID and token. An admin adds the device and makes the token on the Devices page in
# the dashboard (iot-edge register-sql says how), and it's only shown once. If it's lost or this
# file gets out, make a new one there. The old one stops working straight away.
edge_id = "NNP-EDGE-01"
edge_key = "PASTE-THE-TOKEN-FROM-THE-DEVICES-PAGE"

# The password of the 'edge' login on this VM's MQTT broker, used by thing-com and fake-thing.
# Has to match /etc/mosquitto/passwd (install-edge.sh sets both).
mqtt_password = "__EDGE_MQTT_PASSWORD__"

# The password of the 'thing' login. Has to match NODE_SECRET in the secrets.h of this region's
# sensor nodes. To change it: put the new one here and in every node, then
#   sudo mosquitto_passwd -b /etc/mosquitto/passwd thing "<new one>" && sudo systemctl restart mosquitto
node_secret = "__NODE_SECRET__"
