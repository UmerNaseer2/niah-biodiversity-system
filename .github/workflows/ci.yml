# Runs the checks we run by hand before a PR (all but Expo Doctor), so a reviewer can see they passed.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# CI only reads the code, it never pushes or comments.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        # expo-env.d.ts is gitignored because the dev server writes it, so make it here instead.
        run: |
          echo '/// <reference types="expo/types" />' > expo-env.d.ts
          npm run typecheck
      - name: Unit tests
        run: npm test -- --ci

  web:
    name: Web platform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
