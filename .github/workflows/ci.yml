# Runs the same checks we run by hand before a PR, so a reviewer can see they passed.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# CI only reads the code, it never pushes or comments.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: npm audit
        # Lists known advisories in the packages the app ships, as a warning on the run. It doesn't
        # fail, because the phone app's current ones only go away by going back to an old Expo
        # (see docs/security/vulnerability-assessment-plan.md).
        run: |
          npm audit --omit=dev \
            || echo "::warning title=npm audit (mobile)::Advisories found. Open this step to see them."
      - name: Lint
        run: npm run lint
      - name: Typecheck
        # expo-env.d.ts is gitignored because the dev server writes it, so make it here instead.
        run: |
          echo '/// <reference types="expo/types" />' > expo-env.d.ts
          npm run typecheck
      - name: Unit tests
        run: npm test -- --ci
      - name: Expo Doctor
        # Expo Doctor has no way to skip a check, and its app.json check reads our Liquid Glass
        # icon folder (assets/expo.icon, from the SDK 57 template) as a broken PNG. Expo's own
        # schema says a .icon folder is allowed, so we let that one message through and fail on
        # anything else, including a second app.json error.
        run: |
          set +e
          npx --yes expo-doctor > "$RUNNER_TEMP/doctor.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/doctor.log"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -Eq '^[0-9]+/[0-9]+ checks passed\. 1 checks failed' "$RUNNER_TEMP/doctor.log" \
            && [ "$(grep -c 'Field: ' "$RUNNER_TEMP/doctor.log")" -eq 1 ] \
            && grep -q "Field: ios.icon - cannot access file at './assets/expo.icon'" "$RUNNER_TEMP/doctor.log"; then
            echo "Only the known ios.icon message failed, so this counts as a pass."
            exit 0
          fi
          exit 1

  web:
    name: Web platform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: npm audit
        # Reports without failing, the same as the mobile job
        run: |
          npm audit --omit=dev \
            || echo "::warning title=npm audit (web)::Advisories found. Open this step to see them."
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  database:
    name: Database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json
      - run: npm ci
      - name: SQL tests
        # Runs our SQL files in order on PGlite (Postgres built for WebAssembly), then checks what
        # each kind of user can and can't do. No Supabase project or keys needed.
        run: npm test
